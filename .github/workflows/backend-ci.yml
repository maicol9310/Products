name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore Backend Solution
      run: dotnet restore src/Products.Api/Products.Api.sln

    - name: Build Backend Solution
      run: dotnet build src/Products.Api/Products.Api.sln --no-restore --configuration Release

    - name: Prepare TestResults folder
      run: mkdir -p src/tests/Products.Application.Tests/TestResults

    - name: Run Application Tests
      run: dotnet test src/tests/Products.Application.Tests/Products.Application.Tests.csproj --verbosity normal --logger "trx;LogFileName=src/tests/Products.Application.Tests/TestResults/test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: src/tests/Products.Application.Tests/TestResults/test-results.trx
